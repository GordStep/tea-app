services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://tea:tea@db:5432/tea
    depends_on:
      - db

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: tea
      POSTGRES_PASSWORD: tea
      POSTGRES_DB: tea
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: